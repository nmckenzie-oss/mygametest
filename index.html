<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earth Science Memory Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 30px;
      font-size: 2em;
      color: #333;
    }
    .controls {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .controls button, .controls select {
      font-size: 1em;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover {
      background: #e0e7ef;
    }
    .score {
      font-size: 1.1em;
      color: #22577A;
      margin-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(4, 100px);
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .card {
      background: #2D9CDB;
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background 0.25s, transform 0.2s;
      padding: 10px;
      text-align: center;
      min-width: 0;
      min-height: 0;
    }
    .card.revealed, .card.matched {
      background: #56ab2f;
      color: #fff;
      cursor: default;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(33,87,122,0.14);
    }
    .card.matched {
      background: #38b000;
      color: #fff;
      opacity: 0.85;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, minmax(50px, 1fr));
        grid-template-rows: repeat(4, minmax(65px, 1fr));
        gap: 6px;
      }
      .card {
        font-size: 0.9em;
        padding: 6px;
      }
    }
    .message {
      font-size: 1.2em;
      color: #F48C06;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Earth Science Memory Game</h1>
  <div class="controls">
    <select id="level-select">
      <option value="easy">Easy (Name/Name)</option>
      <option value="medium">Medium (Name/Definition)</option>
    </select>
    <button id="restart-btn">Restart</button>
  </div>
  <div class="score" id="score">Score: 0</div>
  <div class="grid" id="game-grid"></div>
  <div class="message" id="message"></div>
  <script>
    // Data
    const terms = [
      {
        name: "Crust",
        def: "The thin outer layer of the Earth where we live.",
      },
      {
        name: "Mantle",
        def: "The thick layer beneath the crust made of hot, slowly moving rock.",
      },
      {
        name: "Outer Core",
        def: "A liquid layer of iron and nickel that surrounds the inner core.",
      },
      {
        name: "Inner Core",
        def: "The solid centre of the Earth made mostly of iron and nickel.",
      },
      {
        name: "Continental Drift",
        def: "The idea that continents move slowly over time.",
      },
      {
        name: "Pangaea",
        def: "A supercontinent that existed millions of years ago before the continents split apart.",
      },
      {
        name: "Tectonic Plates",
        def: "Large pieces of the Earth’s crust that move on the mantle.",
      },
      {
        name: "Plate Boundaries",
        def: "The edges where tectonic plates meet.",
      },
      {
        name: "Convergent Boundary",
        def: "When two plates move toward each other and collide.",
      },
      {
        name: "Divergent Boundary",
        def: "When two plates move apart and new crust forms.",
      },
      {
        name: "Transform Boundary",
        def: "When two plates slide past each other, causing earthquakes.",
      },
      {
        name: "Convection Currents",
        def: "Movements in the mantle caused by heat, driving plate motion.",
      }
    ];

    // Game Config
    const levelConfigs = {
      easy: { score: 5 },
      medium: { score: 10 }
    };

    // State
    let level = "easy";
    let gridCards = [];
    let revealed = [];
    let matchedCards = new Set();
    let score = 0;
    let waiting = false;

    // DOM
    const gridEl = document.getElementById("game-grid");
    const scoreEl = document.getElementById("score");
    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restart-btn");
    const levelSelect = document.getElementById("level-select");

    // Helpers
    function shuffle(array) {
      let a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Build cards for level
    function buildCards(level) {
      if (level === "easy") {
        // Name/Name pairs (6 unique, 2 duplicates for 8 pairs)
        let easyPairs = shuffle(terms).slice(0, 8).map(t => t.name);
        let cards = easyPairs.concat(easyPairs); // 16 cards
        return shuffle(cards).map((v, idx) => ({
          id: idx,
          value: v,
          match: v,
          type: "name"
        }));
      } else if (level === "medium") {
        // Name/Definition pairs (8 pairs)
        let mediumTerms = shuffle(terms).slice(0, 8);
        let cards = [];
        mediumTerms.forEach((t, i) => {
          cards.push({
            id: i * 2,
            value: t.name,
            match: t.def,
            type: "name"
          });
          cards.push({
            id: i * 2 + 1,
            value: t.def,
            match: t.name,
            type: "def"
          });
        });
        return shuffle(cards);
      }
    }

    // Render grid
    function renderGrid() {
      gridEl.innerHTML = "";
      gridCards.forEach((card, idx) => {
        const cardEl = document.createElement("div");
        cardEl.className = "card";
        cardEl.dataset.idx = idx;
        if (matchedCards.has(idx)) {
          cardEl.classList.add("matched");
          cardEl.textContent = card.value;
        } else if (revealed.includes(idx)) {
          cardEl.classList.add("revealed");
          cardEl.textContent = card.value;
        } else {
          cardEl.textContent = "";
        }
        cardEl.addEventListener("click", () => handleCardClick(idx));
        cardEl.addEventListener("touchstart", () => handleCardClick(idx));
        gridEl.appendChild(cardEl);
      });
    }

    // Card click
    function handleCardClick(idx) {
      if (waiting) return;
      if (revealed.includes(idx) || matchedCards.has(idx)) return;
      if (revealed.length >= 2) return;

      revealed.push(idx);
      renderGrid();

      if (revealed.length === 2) {
        waiting = true;
        setTimeout(checkMatch, 650);
      }
    }

    // Check match
    function checkMatch() {
      const [i1, i2] = revealed;
      const c1 = gridCards[i1], c2 = gridCards[i2];
      let isMatch = false;
      if (level === "easy") {
        isMatch = c1.value === c2.value;
      } else if (level === "medium") {
        isMatch = (c1.value === c2.match && c2.value === c1.match);
      }
      if (isMatch) {
        matchedCards.add(i1);
        matchedCards.add(i2);
        score += levelConfigs[level].score;
        showMessage("Matched!");
      } else {
        showMessage("Try again!");
      }
      updateScore();
      setTimeout(() => {
        revealed = [];
        renderGrid();
        waiting = false;
        messageEl.textContent = "";
        checkWin();
      }, 900);
    }

    function updateScore() {
      scoreEl.textContent = "Score: " + score;
    }

    function showMessage(msg) {
      messageEl.textContent = msg;
    }

    function checkWin() {
      if (matchedCards.size === 16) {
        showMessage("🎉 You won! Final Score: " + score);
      }
    }

    function restartGame() {
      score = 0;
      matchedCards = new Set();
      revealed = [];
      gridCards = buildCards(level);
      updateScore();
      renderGrid();
      messageEl.textContent = "";
    }

    // Controls
    restartBtn.addEventListener("click", restartGame);
    levelSelect.addEventListener("change", (e) => {
      level = e.target.value;
      restartGame();
    });

    // Init
    function init() {
      level = levelSelect.value;
      restartGame();
    }
    init();
  </script>
</body>
</html>
